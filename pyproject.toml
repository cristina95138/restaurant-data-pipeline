[project]
name = "restaurant-data-pipeline"
version = "0.1.0"
description = "Reference pipeline: restaurant POS and labor data into a layered BigQuery warehouse, with PII controls and reconciliation."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
]

[project.optional-dependencies]
prod = [
    "google-cloud-bigquery>=3.20",
    "paramiko>=3.4",
    "dbt-bigquery>=1.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "dbt-duckdb>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
